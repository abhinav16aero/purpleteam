<!-- RedBlue AI — "Meridian" console (v2). Sovereign autonomous purple-team command center.
     Single self-contained file served same-origin by the coordinator at / (no CDN, CSP-safe, no build).
     Dual-rail shell · persistent global inspector · vertical loop spine. Real API first, badged demo fallback. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RedBlue AI · Meridian</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0e15'/><path d='M32 10v44' stroke='%239d7ff0' stroke-width='3' stroke-linecap='round'/><circle cx='32' cy='22' r='5' fill='%23e05561'/><circle cx='32' cy='42' r='5' fill='%234f8ef0'/></svg>" />
<style>
:root{
  --bg:#090c12; --surface:#10151f; --surface-2:#161d2b; --surface-3:#1b2434; --hover:#1e2740; --raise:#121826;
  --border:#232d40; --border-2:#2c3852; --hair:#1a2233;
  --text:#dce4f1; --muted:#93a0b6; --faint:#616f88;
  --red:#e05561; --red-dim:#d33940; --red-bg:#22141a; --red-bd:#48212a;
  --blue:#4f8ef0; --blue-dim:#2f6fd0; --blue-bg:#111d31; --blue-bd:#264063;
  --green:#35c46b; --green-dim:#1f9d4d; --green-bg:#0e2019; --green-bd:#1e442f;
  --amber:#e0a340; --amber-dim:#b9791a; --amber-bg:#23190d; --amber-bd:#493719;
  --violet:#9d7ff0; --violet-dim:#7a52c8; --violet-bg:#181430; --violet-bd:#332a57;
  --accent:var(--violet); --accent-dim:var(--violet-dim); --cyan:#22b8cf;
  --r:10px; --r-lg:14px; --r-sm:7px;
  --sh:0 1px 2px rgba(0,0,0,.35); --sh-md:0 12px 30px -12px rgba(0,0,0,.6); --sh-pop:0 24px 64px -16px rgba(0,0,0,.72);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif;
  --rail:66px; --panel:198px; --cmd:52px; --insp:346px;
}
:root[data-theme="light"]{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eef2f8; --surface-3:#e7edf6; --hover:#e9eff8; --raise:#f7f9fd;
  --border:#d8e0ec; --border-2:#c4d0e2; --hair:#e6ecf5;
  --text:#172033; --muted:#5c6a82; --faint:#8592a8;
  --red:#d33940; --red-dim:#b52b32; --red-bg:#fdecec; --red-bd:#f3c9cb;
  --blue:#2f6fd0; --blue-dim:#1f57ad; --blue-bg:#e9f1fd; --blue-bd:#c3d8f4;
  --green:#1f9d4d; --green-dim:#177a3c; --green-bg:#e6f6ec; --green-bd:#bfe6cc;
  --amber:#b9791a; --amber-dim:#956013; --amber-bg:#fbf1de; --amber-bd:#eed6a8;
  --violet:#7a52c8; --violet-dim:#5f3ba6; --violet-bg:#f1ecfb; --violet-bd:#d8c9f2;
  --cyan:#0e8fa8;
  --sh:0 1px 2px rgba(20,40,80,.07); --sh-md:0 12px 28px -12px rgba(30,50,90,.22); --sh-pop:0 24px 60px -16px rgba(30,50,90,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
body{color:var(--text);font:13.5px/1.55 var(--sans);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"cv05","ss01";text-rendering:optimizeLegibility}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.grow{flex:1}.nowrap{white-space:nowrap}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.015em}
h1{font-size:21px}h2{font-size:16px}h3{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.up{text-transform:uppercase;letter-spacing:.09em;font-size:10px;font-weight:650;color:var(--faint)}

/* ---------- dual-rail shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) var(--panel) 1fr;height:100vh;transition:grid-template-columns .18s ease}
#app.railonly{--panel:0}
#app.insp #stage{margin-right:var(--insp)}
#rail{background:var(--raise);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:30}
.brandmark{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--surface-3),var(--surface));border:1px solid var(--border);display:grid;place-items:center;margin-bottom:10px;position:relative}
.brandmark::before{content:"";position:absolute;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--red),var(--blue));border-radius:2px}
.railbtn{width:44px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;position:relative}
.railbtn:hover{background:var(--hover);color:var(--text)}
.railbtn.on{color:var(--text);background:var(--surface-2);border-color:var(--border)}
.railbtn.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.railbtn svg{width:19px;height:19px}
.railsep{height:1px;width:26px;background:var(--hair);margin:5px 0}
.railav{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--violet-dim),var(--blue-dim));cursor:pointer}

#panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.panel-h{padding:16px 16px 10px}
.panel-h .g{font-size:15px;font-weight:680;letter-spacing:-.02em}
.panel-h .s{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.plist{flex:1;overflow-y:auto;padding:4px 10px}
.plink{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;position:relative}
.plink:hover{background:var(--hover);color:var(--text)}
.plink.on{background:var(--surface-3);color:var(--text)}
.plink.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:2.5px;border-radius:2px;background:var(--accent)}
.plink .ic{width:17px;height:17px;flex:none;display:grid;place-items:center}.plink .ic svg{width:15px;height:15px}
.plink .cnt{margin-left:auto;font:600 10px/1 var(--mono);padding:2px 6px;border-radius:6px;background:var(--surface-3);color:var(--muted)}
.plink .cnt.amber{background:var(--amber-bg);color:var(--amber)}
.sov{border-top:1px solid var(--border);padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.sov .tenant{display:flex;align-items:center;gap:8px;font-size:12px}
.sov select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 6px;font:inherit;font-size:11px}
.sov .ln{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.pulse{box-shadow:0 0 0 0 var(--green);animation:pd 2.4s infinite}
.dot.red{background:var(--red);animation:none}
@keyframes pd{0%{box-shadow:0 0 0 0 rgba(53,196,107,.5)}70%{box-shadow:0 0 0 6px rgba(53,196,107,0)}100%{box-shadow:0 0 0 0 rgba(53,196,107,0)}}

#stage{display:flex;flex-direction:column;min-width:0;transition:margin-right .2s ease}
#cmd{height:var(--cmd);flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);z-index:20}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs .sep{color:var(--faint)}.crumbs b{color:var(--text);font-weight:640}
.kbar{flex:1;max-width:460px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 11px;color:var(--faint);cursor:text}
.kbar:hover{border-color:var(--border-2)}.kbar svg{width:15px;height:15px}
.kbar kbd{margin-left:auto;font:10px/1 var(--mono);border:1px solid var(--border);border-radius:5px;padding:2px 5px;color:var(--muted)}
.icobtn{width:33px;height:33px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;position:relative}
.icobtn:hover{background:var(--hover);color:var(--text);border-color:var(--border)}.icobtn svg{width:16px;height:16px}
.icobtn .badgeN{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:99px;background:var(--amber);color:#000;font:700 9px/15px var(--mono);text-align:center;padding:0 3px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:6px;font-size:11px;font-weight:650;letter-spacing:.04em}
.seg button.on[data-mode="LIVE"]{background:var(--green-bg);color:var(--green)}
.seg button.on[data-mode="DEMO"]{background:var(--violet-bg);color:var(--violet)}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
#main{flex:1;overflow-y:auto;overflow-x:hidden}
#view{max-width:1600px;margin:0 auto;padding:20px 24px 72px}

/* ---------- meridian section head ---------- */
.mhead{display:flex;align-items:flex-start;gap:12px;margin:4px 0 16px}
.mhead .tick{width:3px;align-self:stretch;min-height:36px;border-radius:3px;background:linear-gradient(var(--accent),transparent);flex:none}
.mhead h1{font-size:20px}.mhead .sub{color:var(--muted);font-size:12.5px;margin-top:3px;max-width:760px}

/* ---------- primitives ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}.g-1-2{grid-template-columns:1fr 2fr}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.card.pad{padding:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--hair)}
.card-h h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:640}
.card-b{padding:15px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:9px;min-width:0;cursor:default;transition:transform .12s,border-color .12s}
.tile.clk{cursor:pointer}.tile.clk:hover{transform:translateY(-2px);border-color:var(--border-2)}
.tile .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:640}
.tile .val{font:680 26px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tile .foot{display:flex;align-items:center;gap:8px;font-size:11px}
.delta{display:inline-flex;align-items:center;gap:3px;font:600 11px/1 var(--mono)}
.delta.u{color:var(--green)}.delta.d{color:var(--red)}.delta.f{color:var(--muted)}
.hero{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;background:var(--surface)}
.hero canvas.mesh{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.hero .inner{position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:5px;font:640 10px/1 var(--mono);letter-spacing:.03em;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.red{color:var(--red);background:var(--red-bg);border-color:var(--red-bd)}.tag.blue{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
.tag.green{color:var(--green);background:var(--green-bg);border-color:var(--green-bd)}.tag.amber{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.tag.violet{color:var(--violet);background:var(--violet-bg);border-color:var(--violet-bd)}.tag.gray{color:var(--muted)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill{display:inline-flex;align-items:center;gap:5px;font:11px/1 var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.green{color:var(--green);border-color:var(--green-bd);background:var(--green-bg)}.pill.red{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
.pill.blue{color:var(--blue);border-color:var(--blue-bd);background:var(--blue-bg)}.pill.amber{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}
.pill.violet{color:var(--violet);border-color:var(--violet-bd);background:var(--violet-bg)}.pill.gray{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:520}
.btn:hover{border-color:var(--border-2);background:var(--hover)}.btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent-dim);color:#fff;font-weight:640}.btn.pri:hover{filter:brightness(1.08)}
.btn.green{background:linear-gradient(180deg,var(--green),var(--green-dim));border-color:var(--green-dim);color:#04140b;font-weight:680}
.btn.danger{background:var(--red-bg);border-color:var(--red-bd);color:var(--red);font-weight:640}
.btn.ghost{background:transparent}.btn.sm{padding:5px 9px;font-size:11.5px}
input,select,textarea{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:var(--r-sm);font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sheet{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:640 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--hair);font-size:13px}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--hover)}tr.sel td{background:var(--violet-bg)}
.sevbar{width:3px;border-radius:3px;height:16px}
.bar{height:7px;border-radius:6px;background:var(--surface-3);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.hbar{display:grid;grid-template-columns:132px 1fr 44px;gap:10px;align-items:center;font-size:12px;margin:8px 0}
.hbar .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .vv{font:11.5px/1 var(--mono);text-align:right}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:12.5px}
.dl dt{color:var(--faint)}.dl dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 16px;color:var(--faint)}.empty .big{font-size:15px;color:var(--muted);margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px;height:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 13px;font-size:12.5px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--text)}.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.glyph{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* ---------- vertical loop spine ---------- */
.spine{position:relative;padding:6px 0}
.spine .rail{position:absolute;left:50%;top:6px;bottom:6px;width:2px;transform:translateX(-50%);background:var(--hair)}
.spine .rail .flow{position:absolute;left:0;width:2px;height:46px;background:linear-gradient(var(--accent),transparent);border-radius:2px;top:0;opacity:.9}
.snode{position:relative;display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;margin:8px 0;min-height:52px}
.snode .knob{grid-column:2;justify-self:center;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface-2);z-index:2;transition:.18s}
.snode .knob svg{width:15px;height:15px}
.snode .cardlet{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:9px 12px;cursor:pointer;transition:.16s;max-width:290px}
.snode .cardlet:hover{border-color:var(--border-2)}
.snode.l .cardlet{grid-column:1;justify-self:end;text-align:right}.snode.r .cardlet{grid-column:3;justify-self:start}
.snode .ph{font:640 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.snode .tt{font-size:12.5px;font-weight:640;margin:3px 0 1px}.snode .st{font:10.5px/1.3 var(--mono);color:var(--muted)}
.snode.active .knob{transform:scale(1.12)}
.snode.active.t-red .knob{border-color:var(--red);color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.snode.active.t-blue .knob{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.snode.active.t-green .knob{border-color:var(--green);color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.snode.active.t-amber .knob{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.snode.active.t-violet .knob{border-color:var(--violet);color:var(--violet);box-shadow:0 0 0 3px var(--violet-bg)}
@media (max-width:720px){.snode{grid-template-columns:34px 1fr}.spine .rail{left:17px}.snode .knob{grid-column:1}.snode.l .cardlet,.snode.r .cardlet{grid-column:2;justify-self:start;text-align:left}}

/* ---------- event stream + swim lanes ---------- */
.stream{display:flex;flex-direction:column;max-height:440px;overflow-y:auto}
.ev{display:grid;grid-template-columns:64px 58px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--hair);cursor:pointer;font-size:12.5px;animation:fin .3s}
.ev:hover{background:var(--hover)}.ev .ts{font:11px/1 var(--mono);color:var(--faint)}
.ev .src{font:700 10px/1 var(--mono);text-align:center;padding:3px 0;border-radius:5px}
.ev .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-RED{color:var(--red);background:var(--red-bg)}.src-BLUE{color:var(--blue);background:var(--blue-bg)}.src-SENSOR{color:var(--cyan);background:var(--blue-bg)}
.src-AI{color:var(--violet);background:var(--violet-bg)}.src-GATE{color:var(--amber);background:var(--amber-bg)}.src-COORD{color:var(--green);background:var(--green-bg)}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.lanes{display:grid;grid-template-columns:120px 1fr;gap:0}
.lane{display:contents}
.lane .lname{padding:10px 12px;border-bottom:1px solid var(--hair);font:640 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px}
.lane .ltrack{border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);padding:7px 10px;display:flex;gap:7px;flex-wrap:wrap;min-height:38px}
.chip-ev{font:11px/1 var(--mono);padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;white-space:nowrap}

/* ---------- graph ---------- */
.gwrap{position:relative;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:radial-gradient(1px 1px at 20px 24px,var(--hair) 1px,transparent 0) 0 0/24px 24px,var(--bg)}
#gcanvas{display:block;width:100%;height:100%;cursor:grab}
.gtools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.gtools .icobtn{background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--border)}
.gtools .icobtn.on{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-bd)}

/* ============================ components ============================ */

  const min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1,step=w/(pts.length-1);

  const c=`var(--${tone})`,last=pts[pts.length-1],ly=(h-4-((last-min)/rng)*(h-8)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" style="overflow:visible">
   <defs><linearGradient id="sg${tone}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".26"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>

 body+=dl(e._props||[]);
 if(e._rels&&e._rels.length)body+=`<div class="insp-sec"><span class="up">Connected</span>${e._rels.map(r=>`<div class="insp-rel"><span class="tag" style="font-size:9px">${r[0]}</span><span class="mono" style="font-size:11px">${esc(r[1])}</span></div>`).join('')}</div>`;

function mountMesh(canvas){
 const DPR=Math.min(2,window.devicePixelRatio||1);let W=canvas.clientWidth||800,H=canvas.clientHeight||200;
 canvas.width=W*DPR;canvas.height=H*DPR;const ctx=canvas.getContext('2d');const R=seedRand(41);
 const N=Math.max(14,Math.min(34,(W/44)|0));const ps=Array.from({length:N},()=>({x:R()*W,y:R()*H,vx:(R()-.5)*.24,vy:(R()-.5)*.24}));
 let raf=0,stop=false;
 function frame(){if(stop)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;});
  for(let i=0;i<N;i++)for(let k=i+1;k<N;k++){const a=ps[i],b=ps[k],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<118){ctx.strokeStyle='rgba(157,127,240,'+(0.14*(1-d/118))+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
  ps.forEach(p=>{ctx.fillStyle='rgba(79,142,240,.5)';ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,6.28);ctx.fill();});
  raf=requestAnimationFrame(frame);}
 frame();return {stop:()=>{stop=true;cancelAnimationFrame(raf);}};
}
