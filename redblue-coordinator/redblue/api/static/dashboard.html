<!-- RedBlue AI — sovereign autonomous purple-team command center.
     Single self-contained file served by the coordinator at / (same-origin → no CORS, CSP-safe, no CDN).
     Every page tries the REAL coordinator API first and falls back to badged demo data (LIVE/DEMO toggle). -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RedBlue AI — Purple-Team Command Center</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'><g stroke='%2335c46b' stroke-width='3.4' stroke-linecap='round'><circle cx='32' cy='32' r='26' stroke-dasharray='132 42'/><circle cx='32' cy='32' r='19' stroke-dasharray='98 34'/></g><circle cx='32' cy='32' r='4.4' fill='%234f8ef0'/></svg>" />
<style>
:root{
  --bg:#090c12; --surface:#10151f; --surface-2:#161d2b; --surface-3:#1b2434; --hover:#1f293c;
  --border:#232d40; --border-2:#2c3852;
  --text:#dce4f1; --muted:#93a0b6; --faint:#5f6c82;
  --red:#e05561; --red-dim:#d33940; --red-bg:#25151a; --red-bd:#4a2028;
  --blue:#4f8ef0; --blue-dim:#2f6fd0; --blue-bg:#121e30; --blue-bd:#274063;
  --green:#35c46b; --green-dim:#1f9d4d; --green-bg:#0f2119; --green-bd:#1d442f;
  --amber:#e0a340; --amber-dim:#b9791a; --amber-bg:#241b0e; --amber-bd:#4a381a;
  --violet:#9d7ff0; --violet-dim:#7a52c8; --violet-bg:#1a1630; --violet-bd:#342a58;
  --cyan:#22b8cf;
  --r:12px; --r-sm:8px; --r-lg:16px;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-md:0 8px 24px -8px rgba(0,0,0,.55); --sh-pop:0 20px 60px -12px rgba(0,0,0,.7);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif;
  --sb:250px; --topbar:56px;
}
:root[data-theme="light"]{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eef2f8; --surface-3:#e7edf6; --hover:#e9eff7;
  --border:#d8e0ec; --border-2:#c4d0e2;
  --text:#172033; --muted:#5c6a82; --faint:#8592a8;
  --red:#d33940; --red-dim:#b52b32; --red-bg:#fdecec; --red-bd:#f4c9cb;
  --blue:#2f6fd0; --blue-dim:#1f57ad; --blue-bg:#e9f1fd; --blue-bd:#c3d8f4;
  --green:#1f9d4d; --green-dim:#177a3c; --green-bg:#e6f6ec; --green-bd:#bfe6cc;
  --amber:#b9791a; --amber-dim:#956013; --amber-bg:#fbf1de; --amber-bd:#eed6a8;
  --violet:#7a52c8; --violet-dim:#5f3ba6; --violet-bg:#f1ecfb; --violet-bd:#d8c9f2;
  --cyan:#0e8fa8;
  --sh:0 1px 2px rgba(20,40,80,.08); --sh-md:0 10px 24px -10px rgba(30,50,90,.22); --sh-pop:0 24px 60px -16px rgba(30,50,90,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
body{color:var(--text);font:13.5px/1.5 var(--sans);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:var(--mono)} .muted{color:var(--muted)} .faint{color:var(--faint)} .grow{flex:1}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em} h1{font-size:20px} h2{font-size:16px} h3{font-size:13px}
button{font:inherit;cursor:pointer}
.nowrap{white-space:nowrap}

/* ---- layout shell ---- */
#app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:var(--topbar) 1fr;height:100vh;
  grid-template-areas:"side top" "side main";transition:grid-template-columns .18s ease}
#app.collapsed{--sb:72px}
#sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#topbar{grid-area:top;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20}
#main{grid-area:main;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
#view{max-width:1560px;margin:0 auto;padding:22px 26px 80px}

/* ---- brand + sidebar nav ---- */
.brand{display:flex;align-items:center;gap:11px;padding:15px 18px 13px;min-height:var(--topbar)}
.brand svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 8px rgba(53,196,107,.35))}
.brand .nm{font-weight:800;font-size:15px;letter-spacing:.2px;background:linear-gradient(115deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand .sub{font-size:9.5px;color:var(--faint);letter-spacing:1.6px;text-transform:uppercase}
.collapsed .brand .txt,.collapsed .navgroup .lbl,.collapsed .sbfoot .txt{display:none}
.nav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.navgroup{margin-top:12px}
.navgroup .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);padding:6px 10px 4px;font-weight:600}
.navlink{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);cursor:pointer;
  position:relative;white-space:nowrap;font-size:13px}
.navlink:hover{background:var(--hover);color:var(--text)}
.navlink.on{background:var(--surface-3);color:var(--text)}
.navlink.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--green),var(--blue))}
.navlink .ic{width:18px;height:18px;flex:none;display:grid;place-items:center;color:currentColor}
.navlink .ic svg{width:16px;height:16px}
.navlink .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.navlink .cnt.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.collapsed .navlink{justify-content:center;padding:9px 0} .collapsed .navlink .cnt{display:none}
.collapsed .navlink.on::before{left:0}
.sbfoot{border-top:1px solid var(--border);padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.sov{display:flex;align-items:center;gap:8px;font-size:11px}
.sov .k{color:var(--faint);letter-spacing:.4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.chip.green{color:var(--green);border-color:var(--green-bd);background:var(--green-bg)}
.chip.violet{color:var(--violet);border-color:var(--violet-bd);background:var(--violet-bg)}
.usr{display:flex;align-items:center;gap:9px;padding-top:2px}
.av{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--violet-dim),var(--blue-dim))}

/* ---- topbar ---- */
.icobtn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center}
.icobtn:hover{background:var(--hover);color:var(--text);border-color:var(--border)}
.icobtn svg{width:17px;height:17px}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs .sep{color:var(--faint)} .crumbs b{color:var(--text);font-weight:600}
.crumbs .mono{color:var(--text)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 11px;color:var(--faint);cursor:text}
.search:hover{border-color:var(--border-2)} .search svg{width:15px;height:15px}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:6px;font-size:11.5px;font-weight:600;letter-spacing:.3px}
.seg button.on{color:var(--text)} .seg button.on[data-mode="LIVE"]{background:var(--green-bg);color:var(--green)}
.seg button.on[data-mode="DEMO"]{background:var(--violet-bg);color:var(--violet)}
.live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pd 2s infinite}
.pulse-dot.down{background:var(--red);animation:none}
@keyframes pd{0%{box-shadow:0 0 0 0 rgba(53,196,107,.5)}70%{box-shadow:0 0 0 7px rgba(53,196,107,0)}100%{box-shadow:0 0 0 0 rgba(53,196,107,0)}}

/* ---- primitives ---- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)} .g-2-1{grid-template-columns:2fr 1fr} .g-1-2{grid-template-columns:1fr 2fr}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
.card-b{padding:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:10px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--border);padding:22px 24px;
  background:radial-gradient(900px 300px at 85% -40%,var(--violet-bg),transparent 70%),radial-gradient(700px 300px at 5% -30%,var(--green-bg),transparent 65%),var(--surface)}
.kpi{padding:15px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .top{display:flex;align-items:center;gap:8px}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .val{font:700 26px/1 var(--mono);letter-spacing:-.5px}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:11.5px}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:600}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;
  padding:2px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.red{color:var(--red);background:var(--red-bg);border-color:var(--red-bd)}
.tag.blue{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
.tag.green{color:var(--green);background:var(--green-bg);border-color:var(--green-bd)}
.tag.amber{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.tag.violet{color:var(--violet);background:var(--violet-bg);border-color:var(--violet-bd)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:8px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--border-2);background:var(--hover)} .btn svg{width:15px;height:15px}
.btn.pri{background:linear-gradient(180deg,var(--green),var(--green-dim));border-color:var(--green-dim);color:#04140b;font-weight:700}
.btn.pri:hover{filter:brightness(1.06)}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue-dim));border-color:var(--blue-dim);color:#fff;font-weight:650}
.btn.danger{background:var(--red-bg);border-color:var(--red-bd);color:var(--red);font-weight:650}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:11.5px}
input,select,textarea{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:var(--r-sm);font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--hover)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.green{color:var(--green);border-color:var(--green-bd);background:var(--green-bg)}
.pill.red{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
.pill.blue{color:var(--blue);border-color:var(--blue-bd);background:var(--blue-bg)}
.pill.amber{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}
.pill.violet{color:var(--violet);border-color:var(--violet-bd);background:var(--violet-bg)}
.pill.gray{color:var(--muted)}
.sev{width:3px;border-radius:3px;align-self:stretch}
.bar{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden;display:flex}.bar i{display:block;height:100%;border-radius:6px}
.hbar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:12px;margin:7px 0}
.hbar .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .vv{font-family:var(--mono);text-align:right;font-size:11.5px}
.mut-list{display:flex;flex-direction:column} .mut-list>div{padding:9px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.mut-list>div:last-child{border-bottom:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px}
.dl dt{color:var(--faint)} .dl dd{margin:0;font-family:var(--mono);text-align:right}
.sectit{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.sectit h1{font-size:19px} .sectit .sub{color:var(--muted);font-size:12.5px}
.empty{color:var(--faint);text-align:center;padding:34px 14px;font-size:13px}
.empty .big{font-size:15px;color:var(--muted);margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px;height:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font-size:12.5px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--text)} .tabs button.on{color:var(--text);border-bottom-color:var(--blue)}

/* ---- purple loop ---- */
.loop{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 12px}
.lstage{flex:1;min-width:104px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px}
.lnode{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r);padding:11px 8px;cursor:pointer;transition:.18s;position:relative;z-index:2}
.lnode:hover{border-color:var(--border-2)}
.lnode .ph{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:600}
.lnode .ttl{font-size:12.5px;font-weight:650;margin:3px 0 1px}
.lnode .st{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.lnode .ico{width:26px;height:26px;margin:0 auto 5px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border)}
.lnode .ico svg{width:15px;height:15px}
.lstage.active .lnode{transform:translateY(-2px);box-shadow:var(--sh-md)}
.lstage.t-red.active .lnode{border-color:var(--red);box-shadow:0 0 0 1px var(--red),var(--sh-md)}
.lstage.t-blue.active .lnode{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),var(--sh-md)}
.lstage.t-green.active .lnode{border-color:var(--green);box-shadow:0 0 0 1px var(--green),var(--sh-md)}
.lstage.t-amber.active .lnode{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),var(--sh-md)}
.lstage.t-violet.active .lnode{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),var(--sh-md)}
.lconn{position:absolute;top:34px;right:-50%;width:100%;height:2px;background:var(--border);z-index:1}
.lstage:last-child .lconn{display:none}
.lconn .pkt{position:absolute;top:-2px;left:0;width:6px;height:6px;border-radius:50%;background:var(--violet);opacity:0}
.lstage.firing .lconn .pkt{animation:travel .8s linear}
@keyframes travel{0%{left:0;opacity:1}100%{left:100%;opacity:0}}
@media (max-width:1100px){.lconn{display:none}.loop{flex-wrap:wrap;gap:8px}.lstage{min-width:calc(33% - 8px)}}

/* ---- event stream ---- */
.stream{display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.ev{display:grid;grid-template-columns:66px 58px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px;animation:fadein .3s ease}
.ev:hover{background:var(--hover)}
.ev .ts{font-family:var(--mono);font-size:11px;color:var(--faint)}
.ev .src{font-family:var(--mono);font-size:10px;font-weight:700;text-align:center;padding:2px 0;border-radius:5px}
.ev .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-RED{color:var(--red);background:var(--red-bg)} .src-BLUE{color:var(--blue);background:var(--blue-bg)}
.src-SENSOR{color:var(--cyan);background:var(--blue-bg)} .src-AI{color:var(--violet);background:var(--violet-bg)}
.src-GATE{color:var(--amber);background:var(--amber-bg)} .src-COORD{color:var(--green);background:var(--green-bg)}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

/* ---- graph ---- */
.graphwrap{position:relative;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:
  radial-gradient(1px 1px at 20px 30px,var(--border) 1px,transparent 0) 0 0/26px 26px,var(--bg)}
#gcanvas{display:block;width:100%;height:100%;cursor:grab}
.glegend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);
  background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;max-width:70%}
.glegend b{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.glegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.gtools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.gtools .icobtn{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border)}
.inspector{position:absolute;top:0;right:0;bottom:0;width:320px;background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .2s ease;overflow-y:auto;z-index:6}
.inspector.open{transform:none;box-shadow:var(--sh-md)}

/* ---- drawer + palette + toast ---- */
.scrim{position:fixed;inset:0;background:rgba(4,7,12,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .2s ease;z-index:50;overflow-y:auto;box-shadow:var(--sh-pop)}
.drawer.on{transform:none}
.drawer-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:15px 18px;display:flex;align-items:center;gap:10px}
.drawer-b{padding:18px}
.palette{position:fixed;top:80px;left:50%;transform:translateX(-50%) scale(.98);width:min(620px,94vw);background:var(--surface);

.presults{max-height:min(52vh,430px);overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px}
.pitem.sel,.pitem:hover{background:var(--hover)} .pitem .k{margin-left:auto;font-size:10px;color:var(--faint);font-family:var(--mono)}
.pitem .ic{width:20px;color:var(--muted)} .pitem .ic svg{width:16px;height:16px}
.pcat{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);padding:8px 12px 4px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:70}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:var(--r-sm);padding:11px 14px;box-shadow:var(--sh-md);font-size:12.5px;min-width:250px;animation:tin .2s ease}
.toast.green{border-left-color:var(--green)} .toast.amber{border-left-color:var(--amber)} .toast.red{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1}}
.hamb{display:none}

/* ---- misc dataviz ---- */
.donut-wrap{display:flex;align-items:center;gap:18px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px}
.att-cell{border-radius:6px;padding:7px 4px;text-align:center;font-family:var(--mono);font-size:10px;border:1px solid var(--border);cursor:pointer;color:var(--muted)}
.att-cell .c{display:block;font-size:9px;margin-top:2px}
.att-cell:hover{outline:1px solid var(--border-2)}
.node-glyph{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.path{display:flex;flex-direction:column;gap:0}
.pstep{display:grid;grid-template-columns:26px 1fr;gap:14px}
.pstep .rail{display:flex;flex-direction:column;align-items:center}
.pstep .knob{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);display:grid;place-items:center;font-size:11px;z-index:2}
.pstep .line{flex:1;width:2px;background:var(--border)}
.pstep:last-child .line{display:none}
.pstep .body{padding-bottom:16px}
.pstep.det .knob{border-color:var(--green);color:var(--green)} .pstep.miss .knob{border-color:var(--red);color:var(--red)}
.pstep.part .knob{border-color:var(--amber);color:var(--amber)}

/* ---- deterministic pseudo-random (stable demo sparklines, no Math.random flicker) ---- */
function seedRand(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)/4294967296);};}
function sparkPts(seed,n=24,base=0.5,amp=0.4){const r=seedRand(seed);const a=[];let v=base;for(let i=0;i<n;i++){v=clamp(v+(r()-.5)*amp*.5,.05,.95);a.push(v);}return a;}

/* ---- fetch that never throws; returns {ok,data} ---- */
async function api(path,opts){try{const r=await fetch(path,opts);if(!r.ok)return{ok:false,status:r.status};const ct=r.headers.get('content-type')||'';return{ok:true,data:ct.includes('json')?await r.json():await r.text()};}catch(e){return{ok:false,err:e.message};}}

  timers:[], loop:null};
function clearTimers(){S.timers.forEach(t=>clearInterval(t));S.timers=[];if(S.fg){S.fg.stop();S.fg=null;}if(S.es){S.es.close();S.es=null;}if(S.loop){S.loop.stop();S.loop=null;}}
function every(ms,fn){const t=setInterval(fn,ms);S.timers.push(t);return t;}

/* ======================= COMPONENTS ======================= */
function sparkline(pts,tone='blue',w=104,h=30){
  const min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1;
  const step=w/(pts.length-1);
  const pth=pts.map((p,i)=>`${(i*step).toFixed(1)},${(h-4-((p-min)/rng)*(h-8)).toFixed(1)}`).join(' ');
  const c=`var(--${tone})`;const last=pts[pts.length-1],lx=w,ly=(h-4-((last-min)/rng)*(h-8)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${pth} ${w},${h}" fill="url(#sg)"/>
    <polyline points="${pth}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="${c}"/></svg>`;
}
function donut(frac,size=140){
  const r=52,c=2*Math.PI*r,det=(frac||0)*c;
  return `<svg viewBox="0 0 140 140" width="${size}" height="${size}" style="transform:rotate(-90deg);flex:none">
    <circle cx=70 cy=70 r=${r} fill=none stroke="var(--surface-3)" stroke-width=15/>
    <circle cx=70 cy=70 r=${r} fill=none stroke="var(--red)" stroke-width=15 stroke-dasharray="${c-det} ${c}" stroke-dashoffset="${-det}"/>
    <circle cx=70 cy=70 r=${r} fill=none stroke="var(--green)" stroke-width=15 stroke-dasharray="${det} ${c}" stroke-linecap=round/>
    <text x=70 y=70 fill="var(--text)" font-size=23 font-weight=700 font-family="var(--mono)" text-anchor=middle dominant-baseline=central transform="rotate(90 70 70)">${pct(frac)}</text></svg>`;
}
function kpi({lab,val,delta,deltaDir,spark,tone='blue',badge}){
  const d=delta?`<span class="delta ${deltaDir||'flat'}">${deltaDir==='up'?'▲':deltaDir==='down'?'▼':'●'} ${delta}</span>`:'';
  return `<div class="card kpi" data-tip="${esc(lab)}">
    <div class="top"><span class="lab">${lab}</span>${badge||''}<span class="grow"></span></div>
    <div class="row" style="align-items:flex-end;gap:12px"><div class="val" style="color:var(--${tone})">${val}</div><span class="grow"></span>${spark?sparkline(spark,tone):''}</div>
    <div class="foot">${d}<span class="faint">vs baseline</span></div></div>`;
}
function badge(kind){const m={LIVE:['green','● LIVE'],SIMULATION:['violet','◆ SIMULATION'],DEMO:['violet','◆ DEMO'],MOCK:['gray','○ MOCK'],
  DEGRADED:['amber','▲ DEGRADED'],VERIFIED:['green','✓ VERIFIED'],REPLAY:['blue','▷ REPLAY']};
  const[c,t]=m[kind]||['gray',kind];return `<span class="tag ${c}">${t}</span>`;}
function pill(status){const m={completed:['green','completed'],running:['amber','running'],simulated:['violet','simulated'],
  failed:['red','failed'],planned:['gray','planned'],paused:['blue','paused'],healthy:['green','healthy'],
  degraded:['amber','degraded'],down:['red','down'],open:['red','open'],detected:['green','detected'],
  missed:['red','missed'],partial:['amber','partial'],pending:['amber','pending'],approved:['green','approved'],rejected:['red','rejected']};
  const[c,t]=m[status]||['gray',status||'—'];return `<span class="pill ${c}">${t}</span>`;}

}

/* ---- interactive Canvas force-graph (drag·zoom·pan·hover·click-select). No CDN. ---- */
function mountForceGraph(canvas,data,onSelect){
 const DPR=Math.min(2,window.devicePixelRatio||1);let W=canvas.clientWidth||900,H=canvas.clientHeight||470;
 canvas.width=W*DPR;canvas.height=H*DPR;const ctx=canvas.getContext('2d');
 const R=seedRand(97);
 const nodes=data.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i*2.4)*170+(R()-.5)*40,y:H/2+Math.sin(i*2.4)*130+(R()-.5)*40,vx:0,vy:0}));
 const byId={};nodes.forEach(n=>byId[n.id]=n);
 const links=data.edges.map(e=>({s:byId[e.source],t:byId[e.target],rel:e.rel})).filter(l=>l.s&&l.t);
 nodes.forEach(n=>n.deg=0);links.forEach(l=>{l.s.deg++;l.t.deg++;});
 const rad=n=>5+Math.min(7,n.deg)*(n.kind==='host'||n.kind==='database'?1.6:1);
 let scale=1,tx=0,ty=0,alpha=1,hover=null,sel=null,drag=null,pan=null,raf=0,stopped=false,focusId=null,moved=false;
 const isDiamond=n=>['technique','mitre','ioc'].includes(n.kind);
 function step(){
  for(let i=0;i<nodes.length;i++)for(let k=i+1;k<nodes.length;k++){const a=nodes[i],b=nodes[k];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2),f=alpha*2100/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}
  links.forEach(l=>{let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=alpha*(d-78)*0.045;l.s.vx+=dx/d*f;l.s.vy+=dy/d*f;l.t.vx-=dx/d*f;l.t.vy-=dy/d*f;});
  nodes.forEach(n=>{if(n===drag)return;n.vx+=(W/2-n.x)*0.0015*alpha;n.vy+=(H/2-n.y)*0.0015*alpha;n.x+=n.vx;n.y+=n.vy;n.vx*=0.86;n.vy*=0.86;});
  if(alpha>0.03)alpha*=0.992;
 }
 function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.translate(tx,ty);ctx.scale(scale,scale);

  links.forEach(l=>{const on=!hi||(hi.has(l.s.id)&&hi.has(l.t.id));ctx.strokeStyle=on?'rgba(140,155,185,.28)':'rgba(120,135,165,.07)';ctx.lineWidth=(on?1.1:0.5)/scale;ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();});

   if(n===sel){ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=2/scale;ctx.beginPath();ctx.arc(n.x,n.y,r+3,0,6.283);ctx.stroke();}
   else if(n===hover){ctx.globalAlpha=1;ctx.strokeStyle='rgba(220,228,241,.8)';ctx.lineWidth=1.5/scale;ctx.beginPath();ctx.arc(n.x,n.y,r+2.5,0,6.283);ctx.stroke();}

 }
