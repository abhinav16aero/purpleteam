[project]
name = "redblue-coordinator"
version = "0.0.1"
description = "RedBlue AI coordinator — the LangGraph brain that closes the purple-team loop"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # loop engine (plan 07)
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-sdk>=0.1.0",
    # API plane
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # connectors / I/O
    "httpx>=0.27.0",
    "neo4j>=5.20.0",
    "tenacity>=9.0.0",
    "apscheduler>=3.10.0",
    # store + models
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anyio>=4.14.2",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redblue"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
