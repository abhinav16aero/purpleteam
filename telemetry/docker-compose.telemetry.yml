# telemetry/docker-compose.telemetry.yml — the sensor plane (P2 / plan 04).
# Wazuh (host HIDS) + Suricata (network IDS, funneled via Wazuh) + Falco (runtime) watching the
# TARGET RANGE, so blue detects red from independent telemetry. Its own Compose project:
#   docker compose -p telemetry -f telemetry/docker-compose.telemetry.yml up
#
# REPRESENTATIVE — validates via `docker compose config`. Wazuh single-node needs a one-time
# cert-generation step (official wazuh-docker `generate-indexer-certs.yml`); those certs mount at
# the `*_ssl` paths below. Not run on a 14GB/no-GPU box (indexer JVM alone ~2-4GB) — see ADR-0003.
name: telemetry

# Wazuh image version pinned inline as ${WAZUH_VERSION:-4.9.2}.

services:
  # ── Wazuh manager: rules/decoders + the custom-vigil Integrator (→ Vigil ingest) ──
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.9.2}
    container_name: wazuh-manager
    hostname: wazuh-manager
    ports:
      - "1514:1514"          # agent enrollment (register)
      - "1515:1515"          # agent comms
      - "55000:55000"        # Wazuh API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      # Vigil base reached over redblue-shared; the Integrator posts findings here.
      - VIGIL_URL=${VIGIL_URL:-http://backend:6987}
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - wazuh_manager_etc:/var/ossec/etc
      # our Integrator + rules (delivered from telemetry/wazuh/)
      - ./wazuh/integrations/custom-vigil:/var/ossec/integrations/custom-vigil:ro
      # The COMPLETE manager config, copied over the default on boot via the official config-mount
      # (0-wazuh-init honours $WAZUH_CONFIG_MOUNT). This is what actually activates the custom-vigil
      # integration + the Suricata/DVWA localfiles — a bare snippet mount never merges into ossec.conf.
      - ./wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # Filebeat certs at the paths the manager actually references (verified: manager boots + the
      # custom-vigil integrator fires with exactly these). From `make certs`.
      - ./wazuh/certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat-key.pem:ro
      - suricata_logs:/var/log/suricata:ro                          # Suricata eve.json (native decoders)
      - dvwa_logs:/var/log/dvwa-apache:ro                           # DVWA apache access log (web-attack rules)
      - falco_logs:/var/log/falco:ro                                # Falco events.json (rules/falco_rules.xml)
      - ./wazuh/rules/falco_rules.xml:/var/ossec/etc/rules/falco_rules.xml:ro   # classify Falco → level≥5 + MITRE
    networks: [telemetry-net, redblue-shared]
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.9.2}
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    profiles: [full]           # OPT-IN: the OpenSearch store + UI. HEAVY (JVM) and needs the full
                               # TLS/opensearch.yml alignment. The manager alone detects + forwards to
                               # Vigil (verified), so the prototype does NOT need this. Add PROFILES=full.
    ports:
      - "9200:9200"          # OpenSearch (alerts: wazuh-alerts-*)
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"   # host needs sysctl vm.max_map_count=262144
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./wazuh/certs:/usr/share/wazuh-indexer/certs:ro
    networks: [telemetry-net]
    restart: unless-stopped

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.9.2}
    container_name: wazuh-dashboard
    profiles: [full]           # OPT-IN Wazuh UI (see wazuh.indexer). Not needed for telemetry→Vigil.
    ports:
      - "8443:5601"          # remapped from 443 (00 §4)
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
    volumes:
      - ./wazuh/certs:/usr/share/wazuh-dashboard/certs:ro
    depends_on: [wazuh.indexer]
    networks: [telemetry-net]
    restart: unless-stopped

  # ── Suricata: network IDS at the range choke point (af-packet). Funnels via Wazuh. ──
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    profiles: [target]                 # monitors DVWA — only meaningful when the target is up
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    # Share DVWA's network namespace so Suricata actually SEES the unicast attack traffic. A Linux
    # bridge floods only broadcast to a passive sniffer, so a range-net-attached Suricata would miss
    # the sandbox→DVWA HTTP flows entirely. In DVWA's netns, `-i eth0` is DVWA's interface.
    network_mode: "service:dvwa"
    # Best-effort ET Open ruleset (needs egress; the base image ships none) then sniff. Under egress
    # lockdown `suricata-update` fails → falls back to whatever rules are present (run it once online).
    entrypoint: ["/bin/sh", "-c"]
    command: ["suricata-update --no-test 2>/dev/null || true; exec suricata -i eth0 -vvv"]
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - suricata_logs:/var/log/suricata     # eve.json — read directly by wazuh.manager (shared volume)
    depends_on: [dvwa]
    restart: unless-stopped

  # NOTE: Suricata → Wazuh is done by the manager tailing eve.json from the shared `suricata_logs`
  # volume (see the manager's <localfile>), NOT a separate agent container — Wazuh publishes no
  # `wazuh-agent` image (the agent is a host package). This is the standard single-node pattern.

  # ── Falco: container/K8s runtime (eBPF). Runtime sensor. ──
  # WIRED to blue via the file lane: Falco writes JSON to falco_logs:/var/log/falco/events.json, the
  # Wazuh manager tails it (<localfile> + rules/falco_rules.xml → level≥5 with MITRE), and custom-vigil
  # forwards it to Vigil as a finding — the same shared-volume pattern as Suricata's eve.json. This adds
  # container-escape / shell-in-container / IMDS coverage on top of Wazuh+Suricata (host+network).
  # (falcosidekick→Kafka stays available for a future stream lane; the file lane is what runs today.)
  falco:
    image: falcosecurity/falco:latest
    container_name: falco
    privileged: true
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - ./falco/falco.yaml:/etc/falco/falco.yaml:ro
      - falco_logs:/var/log/falco                                   # events.json → tailed by wazuh.manager
    networks: [telemetry-net]
    restart: unless-stopped

  falcosidekick:
    image: falcosecurity/falcosidekick:latest
    container_name: falcosidekick
    environment:
      - CONFIG_FILE=/config/falcosidekick.yaml
    volumes:
      - ./falco/falcosidekick.yaml:/config/falcosidekick.yaml:ro
    networks: [telemetry-net, redblue-shared]
    restart: unless-stopped

  # ── Target range (profile `target`): the instrumented victim ──
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: range-dvwa
    networks: [range-net]
    profiles: [target]
    volumes:
      - dvwa_logs:/var/log/apache2       # share the apache access log with wazuh.manager (web-attack rules)
    restart: unless-stopped
  # A Wazuh agent on the target host would enroll to wazuh.manager:1515 (runtime step; see README).

volumes:
  wazuh_manager_data:
  wazuh_manager_etc:
  wazuh_indexer_data:
  suricata_logs:
  dvwa_logs:
  falco_logs:            # Falco events.json shared from falco → wazuh.manager (Falco → Wazuh → Vigil)

networks:
  telemetry-net:
    driver: bridge
  # range-net: target + Suricata sniff + the Kali sandbox (its ONLY extra attachment, 00 §5) so red
  # can reach the target while staying off redblue-shared. EXTERNAL so the decepticon project's
  # sandbox and this project's DVWA/Suricata share one L2 — created once by `make net`.
  range-net:
    external: true
  redblue-shared:
    external: true        # outbound push (manager/sidekick → Vigil :6987) rides the bus
