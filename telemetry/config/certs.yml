# Wazuh TLS cert topology (P2 / plan 04). Node names MUST be the DOTTED compose SERVICE names —
# that's how the components address each other over the network (INDEXER_URL=https://wazuh.indexer,
# filebeat→indexer, etc.) and what full-mode TLS verifies against. A single-label hyphenated host
# (e.g. wazuh-manager) is classified as neither IP nor DNS by the cert tool → "No IP or DNS specified".
# Consumed by `make certs` → wazuh/wazuh-certs-generator, writing PEMs into telemetry/wazuh/certs/.
nodes:
  indexer:
    - name: wazuh.indexer
      ip: wazuh.indexer
  server:
    - name: wazuh.manager
      ip: wazuh.manager
  dashboard:
    - name: wazuh.dashboard
      ip: wazuh.dashboard
