<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Swaraj Chakravyuh">
  <defs>
    <linearGradient id="scv-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c55e"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Chakravyuh: concentric war-array rings, each with a staggered breach-gap -->
  <g stroke="url(#scv-grad)" stroke-width="3.2" stroke-linecap="round">
    <circle cx="32" cy="32" r="26" stroke-dasharray="132 42" transform="rotate(-20 32 32)"/>
    <circle cx="32" cy="32" r="19.5" stroke-dasharray="98 34" transform="rotate(55 32 32)"/>
    <circle cx="32" cy="32" r="13" stroke-dasharray="63 26" transform="rotate(150 32 32)"/>
  </g>
  <!-- core -->
  <circle cx="32" cy="32" r="4.2" fill="url(#scv-grad)"/>
</svg>
