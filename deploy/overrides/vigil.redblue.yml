# deploy/overrides/vigil.redblue.yml — bus attach + port remap + SOVEREIGNTY (P1).
# Plans: 02 §1.6 (bus/ports), 03 (local Ollama, zero egress).
#
# Merged as (Makefile):
#   docker compose -p vigil --env-file deploy/env/vigil.env \
#     -f ../vigil/docker/docker-compose.yml -f deploy/overrides/vigil.redblue.yml up
#
# OLLAMA_URL is set via --env-file vigil.env (interpolated into every ${OLLAMA_URL:-...}).
# DEFAULT_MODEL is added here (base default is the CLOUD claude-sonnet-4-6 — the silent
# fallback plan 03 flagged). Vigil host ports are hardcoded, so the daemon remap uses `!override`.
#
# DEV_MODE=true = the P4 sovereign-ENCLAVE posture (memory: P4 enclave = DEV_MODE; P5 = service JWT).
# The backend/llm-worker fail-closed at import ("JWT_SECRET_KEY required when DEV_MODE=false"), and
# the coordinator↔Vigil calls are not JWT-authenticated yet, so auth is bypassed inside the enclave.
# ⚠ SECURITY: flip to DEV_MODE=false + a real JWT_SECRET_KEY (+ wire REDBLUE_VIGIL_TOKEN) BEFORE Vigil
# is exposed beyond the isolated host (P5). See vigil-governance-gates / plan 08.
services:
  backend:
    environment:
      - DEFAULT_MODEL=ollama/${OLLAMA_MODEL:-qwen2.5-coder:7b}   # override cloud default → local (plan 03)
      - DEV_MODE=true                            # enclave-only — see header warning
    networks:
      - redblue-shared          # + deeptempo-network

  soc-daemon:
    environment:
      - DEFAULT_MODEL=ollama/${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - DEV_MODE=true
    ports: !override            # REPLACE the base list (host 8081 → 8082; internal stays 8081)
      - "8082:8081"
      - "9090:9090"
      - "9091:9091"
    networks:
      - redblue-shared

  llm-worker:
    environment:
      - DEFAULT_MODEL=ollama/${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - DEV_MODE=true
    # The ARQ worker has no HTTP endpoint, so the base image's healthcheck never passes and blocks
    # `make up --wait`. It's NOT on the prototype critical path (the coordinator + the Wazuh→Vigil
    # ingest both use `backend`, which is healthy). Disable the probe so up/wait doesn't gate on it.
    # (If you later want Vigil's autonomous daemon, re-enable and debug the worker separately.)
    healthcheck:
      disable: true
    networks:
      - redblue-shared          # LLM path (→ bifrost → ollama)

  # STRIP cloud from Bifrost: mount the ollama-only sovereign seed. Bifrost then has no
  # Anthropic/OpenAI provider to route to — the strongest blue-side zero-egress guarantee.
  # The file is delivered by setup.sh's overlay copy (overlay/vigil/docker/bifrost/...).
  bifrost:
    volumes: !override
      - ./bifrost/config.sovereign.json:/app/data/config.json:ro
    networks:
      - redblue-shared          # → ollama:11434

networks:
  redblue-shared:
    external: true
